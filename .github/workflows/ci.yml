name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend/app backend/tests database
      - name: Migrate a fresh database
        working-directory: backend
        run: |
          DATABASE_URL=sqlite:///./ci.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci.db PYTHONPATH=.:.. python -m database.seed
      - name: Tests
        run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: snackflow_test
          POSTGRES_USER: snackflow
          POSTGRES_PASSWORD: snackflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U snackflow" --health-interval 5s
          --health-timeout 5s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://snackflow:snackflow@localhost:5432/snackflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Migrate PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://snackflow:snackflow@localhost:5432/snackflow_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Concurrency tests
        run: pytest -q -m postgres

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
